<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<title>LMS Digitalisasi Pembelajaran SD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--sf:#fff;--tx:#0f1b3d;--mu:#5b6682;--pr:#2447d6;--ac:#0ea5a4;--ok:#15803d;--er:#c0392b;--bd:#e2e7f2;--hero:linear-gradient(135deg,#1b2f8f,#2447d6 55%,#0ea5a4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--sf:#141b33;--tx:#e8ecf8;--mu:#9aa6c4;--pr:#7c96ff;--bd:#252f52;--ok:#4ade80;--er:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--sf:#141b33;--tx:#e8ecf8;--mu:#9aa6c4;--pr:#7c96ff;--bd:#252f52;--ok:#4ade80;--er:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.65 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}h1{font-size:1.9rem;font-weight:800}h2{font-size:1.4rem;font-weight:800}h3{font-size:1.05rem;font-weight:700;margin-top:1.4em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:12px 20px}
.logo{font-weight:800;color:var(--pr);flex:1;display:flex;gap:8px;align-items:center}.logo i{font-style:normal;background:var(--hero);color:#fff;border-radius:9px;padding:2px 8px}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;margin-bottom:14px}
.btn{border:0;border-radius:10px;padding:10px 18px;font:600 14px inherit;font-family:inherit;background:var(--pr);color:#fff;cursor:pointer}
.btn.g{background:transparent;color:var(--pr);border:1px solid var(--bd)}.btn:disabled{opacity:.45;cursor:not-allowed}
input{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-size:13px;font-weight:600;color:var(--mu)}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.hero{background:var(--hero);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hero p{opacity:.9;margin:0}.hero ul{padding-left:18px;opacity:.95}
.form{display:flex;align-items:center;justify-content:center;padding:28px}.form>div{width:100%;max-width:370px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:18px}.tabs button{flex:1;border:0;padding:9px;border-radius:9px;background:none;color:var(--mu);font:600 14px inherit;font-family:inherit;cursor:pointer}.tabs .on{background:var(--sf);color:var(--pr)}
.err{color:var(--er);font-size:13px;min-height:20px;margin-bottom:6px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar b{display:block;height:100%;background:var(--hero);transition:width .5s}
.stat{background:var(--hero);color:#fff;border-radius:18px;padding:24px;margin-bottom:18px}.stat .bar{background:#ffffff40;margin-top:12px}.stat .bar b{background:#fff}
.mod{display:flex;gap:14px;align-items:center}.mod .n{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800;background:var(--bg);color:var(--pr);flex:none}
.mod.lock{opacity:.55}.mod .in{flex:1}.mod small{color:var(--mu)}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--mu)}.tag.ok{color:var(--ok)}.tag.op{color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.grid div,.note{background:var(--bg);border-radius:12px;padding:12px 14px}
.note{border-left:4px solid var(--ac);margin:14px 0}
.q{margin-bottom:20px}.q p{font-weight:600;margin:0 0 8px}
.o{display:block;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;cursor:pointer}.o input{width:auto;margin:0 8px 0 0}.o.bad{border-color:var(--er);background:#c0392b14}
.res{text-align:center;padding:26px}.res b{font-size:3rem;display:block}
canvas{width:100%;border-radius:10px;border:1px solid var(--bd)}
@media(max-width:760px){.auth{grid-template-columns:1fr}.hero{padding:28px}}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ti{width:40px;height:40px;padding:9px;border-radius:12px;background:var(--hero);color:#fff;flex:none;display:block;margin-bottom:8px;box-shadow:0 6px 14px #2447d62e}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}.qh .ti{margin:0}.qh p{margin:0;padding-top:8px}
.mod .n{width:50px;height:50px;background:linear-gradient(135deg,#2447d61f,#0ea5a42b)}.mod .n .ic{width:24px;height:24px}
.card{border-radius:18px;box-shadow:0 1px 2px #0f1b3d0f,0 10px 28px #0f1b3d0b}.card li{margin:5px 0}
.card h3{display:flex;align-items:center;gap:9px}.card h3::before{content:"";width:5px;height:1.1em;border-radius:3px;background:linear-gradient(var(--pr),var(--ac))}
.top{backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--bd)}
.btn{box-shadow:0 6px 16px #2447d633;transition:transform .15s}.btn:hover{transform:translateY(-1px)}.btn.g{box-shadow:none}
.grid div{border:1px solid var(--bd);transition:transform .15s}.grid div:hover{transform:translateY(-2px)}
.o:has(input:checked){border-color:var(--pr);background:#2447d614}
.sc{color:#fff;display:block}.hero{position:relative;overflow:hidden}.hero .sc{max-width:340px;margin-bottom:10px}
.mh{background:var(--hero);color:#fff;border-radius:22px;padding:28px;display:flex;gap:20px;align-items:center;justify-content:space-between;margin:14px 0}
.mh h1{font-size:1.7rem}.mh .tag{background:#ffffff2e;color:#fff}.mh .sc{width:300px;max-width:42%;flex:none}
@media(max-width:760px){.mh{flex-direction:column;align-items:flex-start}.mh .sc{max-width:100%;width:100%}}
</style></head>

<script>
const $=s=>document.querySelector(s),mem={};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const PASS=80;
const MX=[{g:['user','users','laptop','board','usb'],qi:['board','laptop','wifioff','usb','user'],h:['user','laptop','board','users']},
{g:['usb','usb','share','folder','file'],qi:['usb','folder','wifioff','usb','file'],h:['usb','laptop','folder']},
{g:['folder','clip','pen','flask','code','chat'],qi:['flask','shape','code','chat','wifioff'],h:['apps','flask','code','chat']},
{g:['touch','board','ruler','pen','plug','dual','share','file'],qi:['touch','touch','ruler','plug','pen'],h:['touch','pen','ruler','plug']},
{g:['dual','dual'],qi:['dual','dual','wifioff','eye','clip'],h:['wifioff','dual','eye','clip']}];
const ic=(n,s=24,c='')=>`<svg class="ic ${c}" width="${s}" height="${s}" viewBox="0 0 24 24"><use href="#${n}"/></svg>`;
const scene=l=>{const n=l.length,st=256/(n-1),P=l.map((_,k)=>[k*st,k%2?66:20]);
 return`<svg class="sc" viewBox="0 0 320 150"><circle cx="270" cy="30" r="60" fill="#fff" fill-opacity=".08"/><circle cx="40" cy="130" r="40" fill="#fff" fill-opacity=".08"/><path d="M${P.map(p=>(p[0]+32)+' '+(p[1]+32)).join('L')}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 6"/>${P.map((p,k)=>`<rect x="${p[0]}" y="${p[1]}" width="64" height="64" rx="18" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".55"/><svg class="ic" x="${p[0]+16}" y="${p[1]+16}" width="32" height="32" viewBox="0 0 24 24"><use href="#${l[k]}"/></svg>`).join('')}</svg>`};
const M=[
{t:"Ekosistem Digital Pembelajaran",d:"Peran guru, murid, laptop, PID, dan media penyimpanan",
b:`<h3>Tujuan</h3><p>Peserta mampu mengoperasikan perangkat digital dasar dan menganalisis pemanfaatannya untuk supervisi pembelajaran digital di satuan pendidikan.</p>
<h3>Indikator Keberhasilan</h3><ul><li>Mengoperasikan dan menghubungkan laptop, papan interaktif digital (PID), serta media penyimpanan eksternal.</li><li>Mengakses dan menampilkan konten Ruang Murid secara luring.</li><li>Memetakan fungsi perangkat dalam ekosistem pembelajaran sekolah.</li><li>Menganalisis penggunaan perangkat secara interaktif dan pasif sebagai acuan supervisi guru.</li></ul>
<h3>Orkestrasi Kelas Terkoneksi</h3><div class="grid"><div><b>Guru</b><br>Orkestrator pembelajaran, memegang kendali skenario.</div><div><b>Murid</b><br>Partisipasi aktif: kreator, bukan sekadar penonton.</div><div><b>Laptop</b><br>Pusat komputasi: memproses data dan menjalankan aplikasi.</div><div><b>PID</b><br>Kanvas kolaborasi, jembatan visual interaktif ke murid.</div><div><b>Media Penyimpanan Eksternal</b><br>Brankas konten, sumber luring Ruang Murid.</div></div>
<div class="note"><b>Catatan Kunci.</b> Integrasi laptop, PID, dan media eksternal membentuk orkestrasi kelas yang beroperasi penuh secara luring tanpa ketergantungan pada internet.</div>
<h3>Fakta atau Miskonsepsi?</h3><ul><li>“PID hanyalah proyektor besar” → <b>Miskonsepsi</b>. PID adalah kanvas interaktif dua arah.</li><li>“Laptop wajib terhubung internet agar PID berguna” → <b>Miskonsepsi</b>.</li><li>“Jika internet mati, pembelajaran digital terhenti” → <b>Miskonsepsi</b>. Konten Ruang Murid tetap dapat diakses luring.</li></ul>`,
q:[["Apa peran PID dalam ekosistem digital pembelajaran?",["Kanvas kolaborasi interaktif dua arah","Proyektor besar satu arah","Tempat menyimpan seluruh file","Pengganti laptop guru"],0],["Laptop berperan sebagai …",["Brankas konten","Pusat komputasi","Kanvas kolaborasi","Jaringan internet"],1],["“Laptop wajib terhubung internet agar PID berguna.” Pernyataan ini adalah …",["Fakta","Miskonsepsi","Benar sebagian di sekolah dasar","Syarat mutlak"],1],["Media penyimpanan eksternal diibaratkan sebagai …",["Kanvas kolaborasi","Pusat komputasi","Brankas konten","Orkestrator"],2],["Dalam orkestrasi kelas terkoneksi, guru berperan sebagai …",["Penonton","Orkestrator pembelajaran","Pengguna pasif","Perangkat keras"],1]]},
{t:"Media Penyimpanan Eksternal & Ruang Murid Offline",d:"Mengakses konten pembelajaran tanpa internet",
b:`<h3>Fitur Media Penyimpanan Eksternal</h3><div class="grid"><div>1. Membaca flashdisk</div><div>2. Membaca SSD atau hard disk eksternal</div><div>3. Menyalin file antar media</div><div>4. Membuka konten pembelajaran dari media eksternal</div><div>5. Menyimpan hasil kerja ke media eksternal</div></div>
<h3>Ruang Murid Offline</h3><p>Konten Ruang Murid dirancang tangguh dan tetap dapat diakses tanpa koneksi internet. Laptop dan PID beroperasi penuh secara luring melalui integrasi media penyimpanan lokal.</p>
<div class="note"><b>Catatan Kunci.</b> Media penyimpanan eksternal adalah sumber luring bagi konten Ruang Murid, sehingga pembelajaran digital tetap berjalan di sekolah tanpa internet.</div>`,
q:[["Manakah yang BUKAN fitur media penyimpanan eksternal?",["Membaca flashdisk","Menyalin file antar media","Menyimpan hasil kerja","Menyiarkan siaran televisi"],3],["Sumber luring konten Ruang Murid adalah …",["Media penyimpanan eksternal","Layar sentuh PID","Wireless screen sharing","Akun media sosial"],0],["Jika internet sekolah mati, pembelajaran digital sebaiknya …",["Dihentikan","Tetap berjalan dengan konten luring","Menunggu internet pulih","Beralih ke ceramah saja"],1],["Selain flashdisk, media yang dapat dibaca perangkat adalah …",["SSD atau hard disk eksternal","Kamera CCTV","Pengeras suara","Kabel listrik"],0],["Menyimpan hasil kerja ke media eksternal berguna untuk …",["Mempercepat internet","Mendokumentasikan hasil tanpa bergantung internet","Menghapus konten lama","Menambah layar PID"],1]]},
{t:"Platform Pembelajaran melalui PID",d:"Rekomendasi platform dan tools pendukung",
b:`<h3>Platform yang Dapat Dimanfaatkan melalui PID</h3><div class="grid"><div><b>Ruang Murid</b><br>Online dan Offline</div><div><b>Kuis & Gim</b><br>Wordwall, Quizizz/Wayground, Kahoot!, Nearpod, Liveworksheets</div><div><b>Desain & Presentasi</b><br>Canva for Education, Google Slides, Microsoft PowerPoint</div><div><b>Simulasi & Sains</b><br>PhET Simulation, Google Earth</div><div><b>Matematika & Koding</b><br>GeoGebra, Scratch</div><div><b>Kolaborasi & Video</b><br>Padlet, YouTube Edu</div></div>
<div class="note">Pelajari penggunaan kontekstual tiap platform agar pemilihan tools sesuai tujuan pembelajaran, bukan sekadar mengikuti tren.</div>`,
q:[["Platform simulasi sains interaktif adalah …",["PhET Simulation","Scratch","Padlet","Kahoot!"],0],["Platform geometri dan matematika dinamis adalah …",["Wordwall","GeoGebra","YouTube Edu","Nearpod"],1],["Platform pemrograman visual berbasis blok untuk anak adalah …",["Scratch","Google Earth","Canva","Quizizz"],0],["Dinding digital untuk berbagi ide dan kolaborasi adalah …",["GeoGebra","PhET","Padlet","Scratch"],2],["Platform yang dapat dipakai tanpa internet adalah …",["Kahoot!","Ruang Murid Offline","Padlet","Nearpod"],1]]},
{t:"Fitur Papan Interaktif Digital",d:"Delapan kelompok fitur untuk praktik langsung",
b:`<h3>Delapan Kelompok Fitur PID</h3><div class="grid"><div><b>1. Interaksi Sentuh</b><br>Multi-touch 5 titik, tulis dengan jari atau stylus, palm erase, talkback, zoom, drag and drop, rotasi objek.</div><div><b>2. Whiteboard Digital</b><br>Pena bebas, warna dan ketebalan, highlighter, penghapus, multi-halaman, sisip gambar dan bentuk, notes.</div><div><b>3. Alat Matematika & Geometri</b><br>Penggaris, busur derajat, segitiga siku-siku dan sama kaki, ukur panjang dan sudut, bangun datar otomatis.</div><div><b>4. Anotasi & Penandaan</b><br>Menulis di atas dokumen, presentasi, gambar, video; highlight; simpan anotasi.</div><div><b>5. Konektivitas</b><br>HDMI, USB, Type-C, wireless screen sharing, mirroring laptop dan smartphone, touch back control, dual screen.</div><div><b>6. Presentasi & Pembelajaran</b><br>Layar penuh, multi-window, picture in picture, multimedia, video dan simulasi.</div><div><b>7. Kolaborasi</b><br>Multi-pengguna, tulis bersama, diskusi kelompok di whiteboard, berbagi tampilan.</div><div><b>8. Pengelolaan Dokumen</b><br>Buka PDF, Word, PowerPoint, Excel; tampilkan gambar, video, audio; ekspor ke PDF atau gambar.</div></div>
<div class="note"><b>Catatan Kunci.</b> Laptop terhubung ke PID melalui mode <b>Duplicate</b> atau <b>Extended Display</b>, lalu dimanfaatkan dengan multi-touch, stylus, palm erase, dan anotasi langsung.</div>`,
q:[["PID mendukung multi-touch hingga berapa titik sentuh bersamaan?",["2 titik","3 titik","5 titik","20 titik"],2],["Palm erase berarti menghapus dengan …",["Stylus","Telapak tangan","Tombol fisik","Perintah suara"],1],["Busur derajat digital termasuk kelompok fitur …",["Alat Matematika dan Geometri","Pengelolaan Dokumen","Kolaborasi","Konektivitas"],0],["HDMI, USB, dan Type-C termasuk fitur …",["Whiteboard","Konektivitas laptop dan perangkat lain","Anotasi","Interaksi sentuh"],1],["Menulis di atas video atau presentasi termasuk fitur …",["Anotasi dan Penandaan","Dual Screen","Ekspor dokumen","Talkback"],0]]},
{t:"Supervisi & Skenario Krisis",d:"Mode tampilan, studi kasus, dan peta supervisi",
b:`<h3>Skenario Krisis: Internet Terputus Total</h3><p>Pembelajaran digital harus tetap berjalan. Pilih mode tampilan yang sesuai:</p><div class="grid"><div><b>Extended Display</b><br>Laptop dan PID menjadi dua layar terpisah. Guru membaca skenario secara privat di laptop, murid melihat media interaktif di PID.</div><div><b>Duplicate Display</b><br>Tampilan laptop persis sama dengan PID. Terbaik untuk demonstrasi langkah aplikasi atau navigasi web.</div></div>
<h3>Studi Kasus</h3><ul><li><b>Kasus 1:</b> sekolah tanpa internet namun memiliki media penyimpanan eksternal berisi konten, tetapi guru kesulitan memanfaatkannya. Strategi: latih guru mengakses konten luring dan jadwalkan praktik rutin.</li><li><b>Kasus 2:</b> SD Cahaya Bangsa kehilangan internet 2 bulan. Solusi sementara: gunakan laptop, PID, dan media eksternal secara luring.</li></ul>
<h3>Fitur Pendukung Supervisi</h3><ol><li>Observasi penggunaan media digital</li><li>Dokumentasi aktivitas pembelajaran</li><li>Penyimpanan hasil pembelajaran</li><li>Analisis tingkat interaktivitas pembelajaran</li><li>Pemantauan keterlibatan peserta didik</li><li>Pemanfaatan platform interaktif</li><li>Integrasi sumber belajar digital</li></ol>
